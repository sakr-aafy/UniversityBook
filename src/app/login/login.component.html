<!-- SECTION CONNEXION -->

         style="background:linear-gradient(150deg,#F9F4F4 0%,#FDF8F8 50%,#F7F8FA 100%);">
  <div class="container-xl px-4">
    <div class="row justify-content-center">
      <div class="col-12 col-sm-10 col-md-8 col-lg-5">

        <!-- Logo et intro -->
        <div class="text-center mb-4">
          <!--a routerLink="/" class="d-inline-flex align-items-center gap-2 mb-4 text-decoration-none">
            <svg width="44" height="44" viewBox="0 0 60 60" fill="none">

            </svg>
            <span class="font-spectral fw-bold fs-5 text-dark">University Book</span>
          </a-->

          
        </div>

        <!-- Carte formulaire -->
        <div class="card border-0 p-4 p-md-5"
             style="border-radius:24px;box-shadow:0 12px 48px -16px rgba(0,0,0,.12);">
          <h1 class="font-spectral fw-bold mb-2" style="font-size:clamp(26px,3.5vw,36px);">
            Bon retour parmi nous
          </h1>
          <p class="mb-0" style="font-size:15px;color:#6B7480;">
            Connectez-vous pour accéder à vos ressources et commandes.
          </p>
          <br>
          <form (ngSubmit)="login()">

            <!-- Message d'erreur -->
            <div class="mb-4" *ngIf="erreur">
              <div class="alert alert-danger py-2 px-3 mb-0" style="font-size:14px;border-radius:12px;">
                <i class="fa-solid fa-circle-exclamation me-2"></i>{{ erreur }}
              </div>
            </div>
            

            <!-- Email ou téléphone -->
            <div class="mb-4">
              <label class="form-label ub-label">Email ou téléphone</label>
              <div class="input-group-ub">
                <i class="fa-regular fa-user input-icon-ub" style="color:#9AA0A8"></i>
                <input type="text"
                       class="form-control ub-input"
                       placeholder="votre@email.com ou 12 345 678"
                       [(ngModel)]="identifiant"
                       name="identifiant"
                       required>
              </div>
            </div>

            <!-- Mot de passe -->
            <div class="mb-3">
              <div class="d-flex justify-content-between align-items-center mb-1">
                <label class="form-label ub-label mb-0">Mot de passe</label>
                <a href="#" class="small text-decoration-none" style="color:var(--accent);">
                  Mot de passe oublié ?
                </a>
              </div>
              <div class="input-group-ub">
                <i class="fa-solid fa-lock input-icon-ub" style="color:#9AA0A8"></i>
                <input [type]="showPassword ? 'text' : 'password'"
                       class="form-control ub-input"
                       placeholder="Votre mot de passe"
                       [(ngModel)]="motDePasse"
                       name="motDePasse"
                       required>
                <button type="button"
                        (click)="togglePassword()"
                        class="btn btn-sm btn-link eye-toggle"
                        tabindex="-1">
                  <i class="fa-regular" [class.fa-eye]="!showPassword" [class.fa-eye-slash]="showPassword"
                     style="color:#9AA0A8;"></i>
                </button>
              </div>
            </div>

            <!-- Souvenir -->
            <div class="d-flex align-items-center gap-2 mb-4">
              <input type="checkbox"
                     class="form-check-input ub-check"
                     id="souvenir"
                     [(ngModel)]="souvenir"
                     name="souvenir">
              <label class="form-check-label small" for="souvenir" style="color:#5A626C;">
                Se souvenir de moi pendant 30 jours
              </label>
            </div>

            <!-- Bouton connexion -->
            <button type="submit"
                    class="btn btn-accent w-100 py-3 rounded-pill fw-semibold mb-4"
                    style="font-size:16px;"
                    [disabled]="chargement">
              <span *ngIf="!chargement">
                <i class="fa-solid fa-right-to-bracket me-2"></i>
                Se connecter
              </span>
              <span *ngIf="chargement">
                <i class="fa-solid fa-spinner fa-spin me-2"></i>
                Connexion en cours...
              </span>
            </button>

            <!-- Séparateur -->
            <div class="d-flex align-items-center gap-3 mb-4">
              <div class="flex-grow-1" style="height:1px;background:#ECEDEF;"></div>
              <span class="small" style="color:#9AA0A8;white-space:nowrap;">ou continuer avec</span>
              <div class="flex-grow-1" style="height:1px;background:#ECEDEF;"></div>
            </div>

            <!-- Connexion Google -->
            <button type="button"
                    class="btn w-100 py-2 mb-4 d-flex align-items-center justify-content-center gap-2 fw-semibold"
                    style="border:1px solid #ECEDEF;border-radius:12px;font-size:14px;color:#1B2430;background:#fff;">
              <svg width="18" height="18" viewBox="0 0 48 48">
                <path fill="#EA4335" d="M24 9.5c3.1 0 5.8 1.1 8 2.9l6-6C34.2 3.2 29.4 1 24 1 14.7 1 6.8 6.6 3.3 14.5l7 5.4C12 14.3 17.5 9.5 24 9.5z"/>
                <path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v8.5h12.7c-.6 3.1-2.3 5.7-4.8 7.4l7.4 5.8c4.3-4 6.8-9.9 6.8-17.2z"/>
                <path fill="#FBBC05" d="M10.3 28.6A14.5 14.5 0 0 1 9.5 24c0-1.6.3-3.1.8-4.6L3.3 14C1.2 17.8 0 22.3 0 24c0 1.7.2 3.4.5 4.9l7.3-5.3c.1.5.3 1 .5 1.4z"/>
                <path fill="#34A853" d="M24 47c5.4 0 10-1.8 13.4-4.8l-7.4-5.8c-2 1.4-4.4 2.1-6 2.1-6.5 0-12-4.8-13.7-11.2l-7 5.4C6.8 41.4 14.7 47 24 47z"/>
              </svg>
              Continuer avec Google
            </button>

          </form>

          <!-- Lien inscription -->
          <p class="text-center mb-0 small" style="color:#6B7480;">
            Pas encore de compte ?
            <a routerLink="/register" class="fw-semibold text-decoration-none" style="color:var(--accent);">
              Créer un compte gratuit
            </a>
          </p>

        </div>

        <!-- Lien retour -->
        <div class="text-center mt-4">
          <a routerLink="/" class="small text-decoration-none d-inline-flex align-items-center gap-1" style="color:#9AA0A8;">
            <i class="fa-solid fa-arrow-left" style="font-size:11px"></i>
            Retour à l'accueil
          </a>
        </div>

      </div>
    </div>
  </div>
</section>
