<div class="p-4 p-lg-5">
  <h1 class="font-spectral fw-bold mb-4" style="font-size:24px;">Mon panier</h1>

  <div class="card border-0 p-4" style="border-radius:20px;box-shadow:0 12px 48px -16px rgba(0,0,0,.1);">

    <p class="text-secondary mb-0" *ngIf="items.length === 0">Votre panier est vide.</p>

    <div class="table-responsive" *ngIf="items.length > 0">
      <table class="table align-middle">
        <thead>
          <tr class="text-secondary small">
            <th>Produit</th>
            <th>Prix</th>
            <th>Quantité</th>
            <th>Sous-total</th>
            <th class="text-end">Action</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let item of items">
            <td class="d-flex align-items-center gap-2">
              <span class="ub-item-icon"><i class="fa-solid" [ngClass]="item.icone"></i></span>
              <span class="fw-semibold">{{ item.titre }}</span>
            </td>
            <td>{{ item.prix | number:'1.3-3' }} د.ت</td>
            <td>
              <div class="d-flex align-items-center gap-2">
                <button class="btn btn-sm btn-outline-dark-ub" (click)="decrementer(item.id)">
                  <i class="fa-solid fa-minus"></i>
                </button>
                <span>{{ item.quantite }}</span>
                <button class="btn btn-sm btn-outline-dark-ub" (click)="incrementer(item.id)">
                  <i class="fa-solid fa-plus"></i>
                </button>
              </div>
            </td>
            <td class="fw-semibold">{{ (item.prix * item.quantite) | number:'1.3-3' }} د.ت</td>
            <td class="text-end">
              <button class="btn btn-sm btn-outline-dark-ub" (click)="supprimer(item.id)" title="Supprimer">
                <i class="fa-solid fa-trash"></i>
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mt-3" *ngIf="items.length > 0">
      <button class="btn btn-outline-dark-ub btn-sm" (click)="vider()">
        <i class="fa-solid fa-trash-can me-1"></i>Vider le panier
      </button>
      <div class="d-flex align-items-center gap-3">
        <span class="fw-bold" style="font-size:18px;">Total : {{ total | number:'1.3-3' }} د.ت</span>
        <button class="btn btn-accent rounded-pill px-4" (click)="payer()">
          <i class="fa-solid fa-credit-card me-2"></i>Passer au paiement
        </button>
      </div>
    </div>
  </div>
</div>
